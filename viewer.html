<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>So sánh & Review Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --bar-bg: #141416;
      --bar-surface: #222226;
      --bar-border: #2E2E34;
      --bar-text: #F4F4F5;
      --bar-muted: #A1A1AA;
      --bar-accent: #0D99FF;
      --bar-approved: #22C55E;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #18181B;
      font-family: var(--font-sans);
      color: var(--bar-text);
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* Top Control Bar */
    .review-bar {
      height: 46px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--bar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 10px;
      flex-shrink: 0;
      z-index: 100;
      overflow-x: auto;
    }

    .app-shell.bar-collapsed .review-bar {
      display: none;
    }

    .bar-left, .bar-center, .bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-btn {
      text-decoration: none;
      color: var(--bar-muted);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid var(--bar-border);
      background: var(--bar-surface);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .back-btn:hover {
      color: #fff;
      border-color: #52525B;
    }

    .breadcrumb {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--bar-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .breadcrumb span.muted {
      color: var(--bar-muted);
    }

    .persona-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(13, 153, 255, 0.15);
      color: #7DD3FC;
      border: 1px solid rgba(13, 153, 255, 0.3);
    }

    /* Version Switcher Pills */
    .version-switcher {
      display: flex;
      align-items: center;
      background: var(--bar-surface);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--bar-border);
      gap: 3px;
    }

    .phase-chip {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      color: #A1A1AA;
      white-space: nowrap;
    }

    .phase-chip.is-mvp {
      background: rgba(251, 191, 36, 0.16);
      color: #FCD34D;
    }

    .rev-chip {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      color: #A1A1AA;
      white-space: nowrap;
    }
    .rev-chip.is-sealed { background: rgba(96, 165, 250, 0.18); color: #93C5FD; }
    .rev-chip.is-ok { background: rgba(74, 222, 128, 0.16); color: #86EFAC; }
    .rev-chip.is-warn { background: rgba(251, 191, 36, 0.16); color: #FCD34D; }
    .rev-chip.is-bad { background: rgba(248, 113, 113, 0.18); color: #FCA5A5; }

    .scope-btn {
      white-space: nowrap;
    }

    .ver-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--bar-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
    }

    .ver-btn:hover {
      color: #fff;
    }

    .ver-btn.active {
      background: var(--bar-accent);
      color: #fff;
      font-weight: 600;
    }

    .dot-approved {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--bar-approved);
    }

    /* Viewport & Compare Controls */
    .tool-group {
      display: flex;
      align-items: center;
      background: var(--bar-surface);
      padding: 2px;
      border-radius: 5px;
      border: 1px solid var(--bar-border);
    }

    .tool-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--bar-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
    }

    .tool-btn:hover {
      color: #fff;
    }

    .tool-btn.active {
      background: #3F3F46;
      color: #fff;
    }

    .action-btn {
      appearance: none;
      border: 1px solid var(--bar-border);
      background: var(--bar-surface);
      color: var(--bar-text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn:hover {
      border-color: #71717A;
    }

    /* Note Banner */
    .note-strip {
      background: #1E1E22;
      border-bottom: 1px solid var(--bar-border);
      padding: 6px 14px;
      font-size: 12px;
      color: #D4D4D8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .app-shell.bar-collapsed .note-strip {
      display: none;
    }

    /* Stage / Viewport Area */
    .stage {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      overflow: auto;
      background: #0E0E11;
      position: relative;
    }

    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 100%;
    }

    .pane + .pane {
      border-left: 2px solid var(--bar-accent);
    }

    .compare-header {
      width: 100%;
      background: #18181B;
      border-bottom: 1px solid var(--bar-border);
      padding: 4px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .compare-select {
      background: var(--bar-surface);
      color: #fff;
      border: 1px solid var(--bar-border);
      border-radius: 4px;
      padding: 2px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .iframe-wrap {
      width: 100%;
      height: 100%;
      background: #fff;
      transition: width 0.2s ease, height 0.2s ease;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .stage.vp-desktop .iframe-wrap {
      width: 1440px;
      max-width: 100%;
      height: 900px;
      max-height: 96%;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--bar-border);
    }

    .stage.vp-tablet .iframe-wrap {
      width: 768px;
      max-width: 100%;
      height: 1024px;
      max-height: 95%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #3F3F46;
    }

    .stage.vp-mobile .iframe-wrap {
      width: 390px;
      max-width: 100%;
      height: 844px;
      max-height: 95%;
      border-radius: 24px;
      overflow: hidden;
      border: 4px solid #3F3F46;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    /* Floating Expand Pill when collapsed */
    .expand-pill {
      display: none;
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 200;
      background: rgba(20, 20, 22, 0.9);
      backdrop-filter: blur(6px);
      color: #fff;
      border: 1px solid var(--bar-border);
      padding: 6px 12px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .app-shell.bar-collapsed .expand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* QR Popover Modal */
    .qr-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .qr-backdrop.open {
      display: flex;
    }

    .qr-card {
      background: #1E1E22;
      border: 1px solid var(--bar-border);
      border-radius: 12px;
      padding: 18px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .qr-box {
      width: 200px;
      height: 200px;
      margin: 12px auto;
      padding: 10px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box svg, .qr-box img {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 768px) {
      .hide-mobile {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="review-bar">
      <div class="bar-left">
        <a href="./index.html" class="back-btn" id="backHubBtn">← Hub</a>
        <div class="breadcrumb" id="breadcrumb">
          <span class="muted">loading...</span>
        </div>
      </div>

      <div class="bar-center">
        <div class="version-switcher" id="versionSwitcher"></div>
        <button class="action-btn hide-mobile" id="splitCompareBtn" title="So sánh 2 phiên bản cạnh nhau (A | B)">
          ⇄ So sánh A|B
        </button>
      </div>

      <div class="bar-right">
        <div class="tool-group hide-mobile" id="viewportSwitcher">
          <button class="tool-btn active" data-vp="full">100%</button>
          <button class="tool-btn" data-vp="desktop">1440px</button>
          <button class="tool-btn" data-vp="tablet">iPad 768</button>
          <button class="tool-btn" data-vp="mobile">iPhone 390</button>
        </div>
        <button class="action-btn" id="openQrBtn" title="Hiện mã QR để quét mở trên điện thoại/tablet (Phím Q)">
          📱 QR
        </button>
        <button class="action-btn" id="copyPromoteBtn" title="Copy lệnh chốt phiên bản này về thư mục dự án">
          ✓ Lệnh Chốt
        </button>
        <a class="action-btn" id="rawLinkBtn" href="#" target="_blank" title="Mở URL gốc không có thanh công cụ">
          Mở gốc ↗
        </a>
        <button class="action-btn" id="collapseBarBtn" title="Ẩn thanh công cụ để xem toàn màn hình">
          Ẩn thanh
        </button>
      </div>
    </header>

    <div class="note-strip" id="noteStrip">
      <span id="versionNoteText">Đang tải thông tin phiên bản...</span>
      <span style="font-family: var(--font-mono); font-size: 11px; color: var(--bar-muted);">
        Phím tắt: [1-9] Chuyển bản · [S] So sánh đôi · [Q] Mã QR · [H] Ẩn/Hiện thanh
      </span>
    </div>

    <main class="stage" id="stageArea"></main>

    <button class="expand-pill" id="expandBarBtn">
      <span>▲ Hiện thanh chuyển phiên bản</span>
    </button>
  </div>

  <!-- QR Modal -->
  <div class="qr-backdrop" id="qrBackdrop">
    <div class="qr-card">
      <div style="display:flex; justify-content:space-between; align-items:center; text-align:left;">
        <div>
          <div style="font-size:13px; font-weight:600;" id="qrTitle">Quét mở trên Điện thoại</div>
          <div style="font-family:var(--font-mono); font-size:11px; color:var(--bar-muted);" id="qrSub"></div>
        </div>
        <button class="action-btn" id="closeQrBtn">✕</button>
      </div>
      <div class="qr-box" id="qrBox"></div>
      <div style="font-size:11px; color:var(--bar-muted); margin-bottom:10px;">
        Đưa camera iPhone / iPad vào mã QR để test trực tiếp phiên bản này.
      </div>
      <div style="font-family:var(--font-mono); font-size:10px; color:#A1A1AA; word-break:break-all; background:#141416; padding:6px 8px; border-radius:4px;" id="qrUrlText"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const state = {
      project: params.get('project') || '',
      feature: params.get('feature') || '',
      version: params.get('version') || '',
      compareVersion: params.get('compare') || '',
      splitMode: Boolean(params.get('compare')),
      phase: (params.get('phase') || '').toUpperCase(),
      viewport: 'full',
      featureData: null
    };

    // Phiên bản hiển thị trên thanh chuyển: theo phase (nếu có) + bản chốt hiện hành để đối chiếu
    function visibleVersions() {
      const feat = state.featureData;
      if (!feat) return [];
      if (!state.phase) return feat.versions;
      const inPhase = feat.versions.filter((v) => v.phase === state.phase);
      if (!inPhase.length) return feat.versions;
      return feat.versions.filter((v) => v.phase === state.phase || v.version === feat.approved_version);
    }

    function phaseChip(v) {
      if (!v || !v.phase) return '';
      return `<span class="phase-chip ${v.stage === 'mvp' ? 'is-mvp' : ''}">${v.phase}${v.stage === 'mvp' ? '·MVP' : ''}</span>`;
    }

    const VERDICT_SHORT = { APPROVE_WITH_NOTES: 'ổn, có ghi chú', CHANGES_REQUESTED: 'cần sửa', BLOCKER: 'BLOCKER' };

    // Trạng thái review/khóa của version (từ prototypes.json): chip ngắn + mô tả đầy đủ
    function revState(v) {
      if (!v) return { cls: '', short: '', long: '' };
      const rev = v.rev || 1;
      const r = v.review || {};
      const tiers = [['T1', r.core], ['T2', r.business]].filter(([, x]) => x);
      if (v.sealed) return { cls: 'is-sealed', short: `🔒 rev${rev}`, long: `Đã khóa · rev${rev} (đã tới tay người — mọi thay đổi là version mới)` };
      if (!tiers.length) return { cls: '', short: `rev${rev}`, long: `Chưa review · rev${rev}` };
      const parts = tiers.map(([n, x]) => `${n} r${x.round} ${VERDICT_SHORT[x.verdict] || x.verdict}`).join(' · ');
      const stale = (r.stale || []).length > 0;
      const open = r.open || 0;
      const cls = stale || open ? (tiers.some(([, x]) => x.verdict === 'BLOCKER') ? 'is-bad' : 'is-warn') : 'is-ok';
      const extra = stale ? ' · cần review lại' : open ? ` · còn ${open} BLOCKER/MAJOR` : '';
      return { cls, short: `rev${rev}${stale ? ' ↻' : ''}`, long: `Nháp rev${rev} · ${parts}${extra}` };
    }

    function revChip(v) {
      const s = revState(v);
      return s.short ? `<span class="rev-chip ${s.cls}" title="${s.long}">${s.short}</span>` : '';
    }

    function getProtoUrl(ver) {
      return `./prototypes/${encodeURIComponent(state.project)}/${encodeURIComponent(state.feature)}/${encodeURIComponent(ver)}/index.html`;
    }

    function showQrModal() {
      const fullUrl = window.location.href;
      document.getElementById('qrTitle').textContent = state.featureData ? (state.featureData.title || state.feature) : state.feature;
      document.getElementById('qrSub').textContent = `${state.project} / ${state.version}`;
      document.getElementById('qrUrlText').textContent = fullUrl;
      const box = document.getElementById('qrBox');
      if (typeof window.qrcode === 'function') {
        const qr = window.qrcode(0, 'M');
        qr.addData(fullUrl);
        qr.make();
        box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      } else {
        box.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(fullUrl)}" alt="QR" />`;
      }
      document.getElementById('qrBackdrop').classList.add('open');
    }

    async function init() {
      try {
        const res = await fetch('./prototypes.json?t=' + Date.now());
        const manifest = await res.json();
        const proj = (manifest.projects || []).find((p) => p.slug === state.project);
        const feat = proj ? (proj.features || []).find((f) => f.slug === state.feature) : null;

        if (!feat || !feat.versions || feat.versions.length === 0) {
          document.getElementById('stageArea').innerHTML =
            `<div style="margin:auto;text-align:center;color:#A1A1AA;padding:24px;">Không tìm thấy dữ liệu cho <code>${state.project}/${state.feature}</code></div>`;
          return;
        }

        state.featureData = feat;
        if (!state.version || !feat.versions.some((v) => v.version === state.version)) {
          state.version = feat.approved_version || feat.versions[feat.versions.length - 1].version;
        }

        if (state.phase && !feat.versions.some((v) => v.phase === state.phase)) {
          state.phase = '';
        }

        if (!state.compareVersion) {
          // Mặc định đối chiếu với bản chốt hiện hành (nếu có), không thì bản khác gần nhất
          const approvedOther = feat.approved_version && feat.approved_version !== state.version ? feat.approved_version : '';
          const other = approvedOther
            ? { version: approvedOther }
            : visibleVersions().slice().reverse().find((v) => v.version !== state.version);
          state.compareVersion = other ? other.version : state.version;
        }

        updateUrl();
        renderHeader();
        renderStage();
      } catch (e) {
        console.error(e);
      }
    }

    function updateUrl() {
      const next = new URLSearchParams();
      next.set('project', state.project);
      next.set('feature', state.feature);
      next.set('version', state.version);
      if (state.phase) next.set('phase', state.phase);
      if (state.splitMode && state.compareVersion) {
        next.set('compare', state.compareVersion);
      }
      window.history.replaceState({}, '', `${window.location.pathname}?${next.toString()}`);
      const hub = new URLSearchParams({ project: state.project });
      if (state.phase) hub.set('phase', state.phase);
      document.getElementById('backHubBtn').href = `./index.html?${hub.toString()}`;
    }

    function renderHeader() {
      const feat = state.featureData;
      const approved = feat.approved_version || '';

      document.getElementById('breadcrumb').innerHTML = `
        <span class="muted">${state.project} /</span>
        <strong>${feat.title || state.feature}</strong>
        ${feat.persona ? `<span class="persona-pill">${feat.persona}</span>` : ''}
      `;

      const switcher = document.getElementById('versionSwitcher');
      switcher.innerHTML = '';
      const hasPhases = feat.versions.some((v) => v.phase);
      if (hasPhases) {
        const phases = [...new Set(feat.versions.map((v) => v.phase).filter(Boolean))];
        const scope = document.createElement('select');
        scope.className = 'compare-select scope-btn';
        scope.title = 'Lọc phiên bản theo phase';
        scope.innerHTML = `<option value="">Mọi phase</option>` +
          phases.map((ph) => `<option value="${ph}" ${ph === state.phase ? 'selected' : ''}>${ph}</option>`).join('');
        scope.onchange = (e) => {
          state.phase = e.target.value;
          const vis = visibleVersions();
          if (!vis.some((v) => v.version === state.version)) state.version = vis[vis.length - 1].version;
          updateUrl();
          renderHeader();
          renderStage();
        };
        switcher.appendChild(scope);
      }
      visibleVersions().forEach((v, idx) => {
        const btn = document.createElement('button');
        btn.className = 'ver-btn' + (v.version === state.version ? ' active' : '');
        const isApp = approved === v.version;
        btn.innerHTML = `
          <span>${idx + 1}. ${v.version}</span>
          ${phaseChip(v)}
          ${revChip(v)}
          ${isApp ? '<span class="dot-approved" title="Bản đã chốt"></span>' : ''}
        `;
        btn.onclick = () => {
          state.version = v.version;
          updateUrl();
          renderHeader();
          renderStage();
        };
        switcher.appendChild(btn);
      });

      const currVerObj = feat.versions.find((v) => v.version === state.version) || {};
      const isCurrApproved = approved === state.version;
      document.getElementById('versionNoteText').innerHTML = `
        <span>
          <strong>[${state.version}]</strong>
          ${currVerObj.phase ? `<span style="color:#A1A1AA;">${currVerObj.stage === 'mvp' ? 'MVP · ' : ''}${currVerObj.phase} ·</span>` : ''}
          ${isCurrApproved ? '<span style="color:#4ADE80;font-weight:600;"> (BẢN ĐÃ CHỐT)</span> ' : ''}
          ${isCurrApproved ? '' : `<span class="rev-chip ${revState(currVerObj).cls}">${revState(currVerObj).long}</span> `}
          ${currVerObj.notes || 'Không có ghi chú thêm.'}
        </span>
      `;

      document.getElementById('rawLinkBtn').href = getProtoUrl(state.version);

      const splitBtn = document.getElementById('splitCompareBtn');
      splitBtn.style.borderColor = state.splitMode ? 'var(--bar-accent)' : '';
      splitBtn.style.color = state.splitMode ? '#7DD3FC' : '';
    }

    function renderStage() {
      const stage = document.getElementById('stageArea');
      stage.className = 'stage' + (state.viewport !== 'full' ? ` vp-${state.viewport}` : '');

      const feat = state.featureData;
      if (!state.splitMode) {
        stage.innerHTML = `
          <div class="pane">
            <div class="iframe-wrap">
              <iframe src="${getProtoUrl(state.version)}" title="${state.version}"></iframe>
            </div>
          </div>
        `;
      } else {
        const label = (v) => `${v.version}${v.phase ? ` [${v.phase}]` : ''}${v.version === feat.approved_version ? ' ✓ chốt' : ''}`;
        const optionsA = feat.versions
          .map((v) => `<option value="${v.version}" ${v.version === state.version ? 'selected' : ''}>${label(v)}</option>`)
          .join('');
        const optionsB = feat.versions
          .map((v) => `<option value="${v.version}" ${v.version === state.compareVersion ? 'selected' : ''}>${label(v)}</option>`)
          .join('');

        stage.innerHTML = `
          <div class="pane">
            <div class="compare-header">
              <span>Khung A (Chính)</span>
              <select class="compare-select" id="selectPaneA">${optionsA}</select>
            </div>
            <div class="iframe-wrap">
              <iframe src="${getProtoUrl(state.version)}" title="Pane A"></iframe>
            </div>
          </div>
          <div class="pane">
            <div class="compare-header">
              <span>Khung B (Đối chiếu)</span>
              <select class="compare-select" id="selectPaneB">${optionsB}</select>
            </div>
            <div class="iframe-wrap">
              <iframe src="${getProtoUrl(state.compareVersion)}" title="Pane B"></iframe>
            </div>
          </div>
        `;

        document.getElementById('selectPaneA').onchange = (e) => {
          state.version = e.target.value;
          updateUrl();
          renderHeader();
          renderStage();
        };
        document.getElementById('selectPaneB').onchange = (e) => {
          state.compareVersion = e.target.value;
          updateUrl();
          renderStage();
        };
      }
    }

    document.getElementById('splitCompareBtn').onclick = () => {
      state.splitMode = !state.splitMode;
      updateUrl();
      renderHeader();
      renderStage();
    };

    document.querySelectorAll('#viewportSwitcher .tool-btn').forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll('#viewportSwitcher .tool-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.viewport = btn.dataset.vp;
        renderStage();
      };
    });

    document.getElementById('openQrBtn').onclick = showQrModal;
    document.getElementById('closeQrBtn').onclick = () => document.getElementById('qrBackdrop').classList.remove('open');
    document.getElementById('qrBackdrop').onclick = (e) => {
      if (e.target.id === 'qrBackdrop') document.getElementById('qrBackdrop').classList.remove('open');
    };

    document.getElementById('copyPromoteBtn').onclick = async () => {
      const cmd = `/Users/vuonganhvu/Desktop/workspace/mockup/bin/proto promote ${state.project} ${state.feature} ${state.version} --to /Users/vuonganhvu/Desktop/workspace/${state.project}`;
      try {
        await navigator.clipboard.writeText(cmd);
        const btn = document.getElementById('copyPromoteBtn');
        const old = btn.textContent;
        btn.textContent = 'Đã copy lệnh!';
        setTimeout(() => (btn.textContent = old), 1800);
      } catch (err) {
        prompt('Copy lệnh dưới đây để chốt phiên bản:', cmd);
      }
    };

    document.getElementById('collapseBarBtn').onclick = () => {
      document.getElementById('appShell').classList.add('bar-collapsed');
    };

    document.getElementById('expandBarBtn').onclick = () => {
      document.getElementById('appShell').classList.remove('bar-collapsed');
    };

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'Escape') {
        document.getElementById('qrBackdrop').classList.remove('open');
      } else if (e.key.toLowerCase() === 'q') {
        document.getElementById('qrBackdrop').classList.contains('open')
          ? document.getElementById('qrBackdrop').classList.remove('open')
          : showQrModal();
      } else if (e.key.toLowerCase() === 'h') {
        document.getElementById('appShell').classList.toggle('bar-collapsed');
      } else if (e.key.toLowerCase() === 's') {
        state.splitMode = !state.splitMode;
        updateUrl();
        renderHeader();
        renderStage();
      } else if (/^[1-9]$/.test(e.key) && state.featureData) {
        const idx = parseInt(e.key, 10) - 1;
        const vis = visibleVersions();
        if (vis[idx]) {
          state.version = vis[idx].version;
          updateUrl();
          renderHeader();
          renderStage();
        }
      }
    });

    init();
  </script>
</body>
</html>
