<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>So sánh & Review Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bar-bg: #141416;
      --bar-surface: #222226;
      --bar-border: #2E2E34;
      --bar-text: #F4F4F5;
      --bar-muted: #A1A1AA;
      --bar-accent: #0D99FF;
      --bar-approved: #22C55E;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #18181B;
      font-family: var(--font-sans);
      color: var(--bar-text);
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* Top Control Bar */
    .review-bar {
      height: 46px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--bar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 10px;
      flex-shrink: 0;
      z-index: 100;
      overflow-x: auto;
    }

    .app-shell.bar-collapsed .review-bar {
      display: none;
    }

    .bar-left, .bar-center, .bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-btn {
      text-decoration: none;
      color: var(--bar-muted);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid var(--bar-border);
      background: var(--bar-surface);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .back-btn:hover {
      color: #fff;
      border-color: #52525B;
    }

    .breadcrumb {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--bar-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .breadcrumb span.muted {
      color: var(--bar-muted);
    }

    .persona-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(13, 153, 255, 0.15);
      color: #7DD3FC;
      border: 1px solid rgba(13, 153, 255, 0.3);
    }

    /* Version Switcher Pills */
    .version-switcher {
      display: flex;
      align-items: center;
      background: var(--bar-surface);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--bar-border);
      gap: 3px;
    }

    .ver-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--bar-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
    }

    .ver-btn:hover {
      color: #fff;
    }

    .ver-btn.active {
      background: var(--bar-accent);
      color: #fff;
      font-weight: 600;
    }

    .dot-approved {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--bar-approved);
    }

    /* Viewport & Compare Controls */
    .tool-group {
      display: flex;
      align-items: center;
      background: var(--bar-surface);
      padding: 2px;
      border-radius: 5px;
      border: 1px solid var(--bar-border);
    }

    .tool-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--bar-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
    }

    .tool-btn:hover {
      color: #fff;
    }

    .tool-btn.active {
      background: #3F3F46;
      color: #fff;
    }

    .action-btn {
      appearance: none;
      border: 1px solid var(--bar-border);
      background: var(--bar-surface);
      color: var(--bar-text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn:hover {
      border-color: #71717A;
    }

    /* Note Banner */
    .note-strip {
      background: #1E1E22;
      border-bottom: 1px solid var(--bar-border);
      padding: 6px 14px;
      font-size: 12px;
      color: #D4D4D8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .app-shell.bar-collapsed .note-strip {
      display: none;
    }

    /* Stage / Viewport Area */
    .stage {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      overflow: auto;
      background: #0E0E11;
      position: relative;
    }

    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 100%;
    }

    .pane + .pane {
      border-left: 2px solid var(--bar-accent);
    }

    .compare-header {
      width: 100%;
      background: #18181B;
      border-bottom: 1px solid var(--bar-border);
      padding: 4px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .compare-select {
      background: var(--bar-surface);
      color: #fff;
      border: 1px solid var(--bar-border);
      border-radius: 4px;
      padding: 2px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .iframe-wrap {
      width: 100%;
      height: 100%;
      background: #fff;
      transition: width 0.2s ease, height 0.2s ease;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .stage.vp-desktop .iframe-wrap {
      width: 1440px;
      max-width: 100%;
      height: 900px;
      max-height: 96%;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--bar-border);
    }

    .stage.vp-tablet .iframe-wrap {
      width: 768px;
      max-width: 100%;
      height: 1024px;
      max-height: 95%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #3F3F46;
    }

    .stage.vp-mobile .iframe-wrap {
      width: 390px;
      max-width: 100%;
      height: 844px;
      max-height: 95%;
      border-radius: 24px;
      overflow: hidden;
      border: 4px solid #3F3F46;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    /* Floating Expand Pill when collapsed */
    .expand-pill {
      display: none;
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 200;
      background: rgba(20, 20, 22, 0.9);
      backdrop-filter: blur(6px);
      color: #fff;
      border: 1px solid var(--bar-border);
      padding: 6px 12px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .app-shell.bar-collapsed .expand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    @media (max-width: 768px) {
      .hide-mobile {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="review-bar">
      <div class="bar-left">
        <a href="./index.html" class="back-btn">← Hub</a>
        <div class="breadcrumb" id="breadcrumb">
          <span class="muted">loading...</span>
        </div>
      </div>

      <div class="bar-center">
        <div class="version-switcher" id="versionSwitcher"></div>
        <button class="action-btn hide-mobile" id="splitCompareBtn" title="So sánh 2 phiên bản cạnh nhau (A | B)">
          ⇄ So sánh A|B
        </button>
      </div>

      <div class="bar-right">
        <div class="tool-group hide-mobile" id="viewportSwitcher">
          <button class="tool-btn active" data-vp="full">100%</button>
          <button class="tool-btn" data-vp="desktop">1440px</button>
          <button class="tool-btn" data-vp="tablet">iPad 768</button>
          <button class="tool-btn" data-vp="mobile">iPhone 390</button>
        </div>
        <button class="action-btn" id="copyPromoteBtn" title="Copy lệnh chốt phiên bản này về thư mục dự án">
          ✓ Lệnh Chốt
        </button>
        <a class="action-btn" id="rawLinkBtn" href="#" target="_blank" title="Mở URL gốc không có thanh công cụ">
          Mở gốc ↗
        </a>
        <button class="action-btn" id="collapseBarBtn" title="Ẩn thanh công cụ để xem toàn màn hình">
          Ẩn thanh
        </button>
      </div>
    </header>

    <div class="note-strip" id="noteStrip">
      <span id="versionNoteText">Đang tải thông tin phiên bản...</span>
      <span style="font-family: var(--font-mono); font-size: 11px; color: var(--bar-muted);">
        Phím tắt: [1-9] Chuyển bản · [S] So sánh đôi · [H] Ẩn/Hiện thanh
      </span>
    </div>

    <main class="stage" id="stageArea"></main>

    <button class="expand-pill" id="expandBarBtn">
      <span>▲ Hiện thanh chuyển phiên bản</span>
    </button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const state = {
      project: params.get('project') || '',
      feature: params.get('feature') || '',
      version: params.get('version') || '',
      compareVersion: params.get('compare') || '',
      splitMode: Boolean(params.get('compare')),
      viewport: 'full',
      featureData: null
    };

    function getProtoUrl(ver) {
      return `./prototypes/${encodeURIComponent(state.project)}/${encodeURIComponent(state.feature)}/${encodeURIComponent(ver)}/index.html`;
    }

    async function init() {
      try {
        const res = await fetch('./prototypes.json?t=' + Date.now());
        const manifest = await res.json();
        const proj = (manifest.projects || []).find((p) => p.slug === state.project);
        const feat = proj ? (proj.features || []).find((f) => f.slug === state.feature) : null;

        if (!feat || !feat.versions || feat.versions.length === 0) {
          document.getElementById('stageArea').innerHTML =
            `<div style="margin:auto;text-align:center;color:#A1A1AA;padding:24px;">Không tìm thấy dữ liệu cho <code>${state.project}/${state.feature}</code></div>`;
          return;
        }

        state.featureData = feat;
        if (!state.version || !feat.versions.some((v) => v.version === state.version)) {
          state.version = feat.approved_version || feat.versions[feat.versions.length - 1].version;
        }

        if (!state.compareVersion) {
          const other = feat.versions.find((v) => v.version !== state.version);
          state.compareVersion = other ? other.version : state.version;
        }

        renderHeader();
        renderStage();
      } catch (e) {
        console.error(e);
      }
    }

    function updateUrl() {
      const next = new URLSearchParams();
      next.set('project', state.project);
      next.set('feature', state.feature);
      next.set('version', state.version);
      if (state.splitMode && state.compareVersion) {
        next.set('compare', state.compareVersion);
      }
      window.history.replaceState({}, '', `${window.location.pathname}?${next.toString()}`);
    }

    function renderHeader() {
      const feat = state.featureData;
      const approved = feat.approved_version || '';

      document.getElementById('breadcrumb').innerHTML = `
        <span class="muted">${state.project} /</span>
        <strong>${feat.title || state.feature}</strong>
        ${feat.persona ? `<span class="persona-pill">${feat.persona}</span>` : ''}
      `;

      const switcher = document.getElementById('versionSwitcher');
      switcher.innerHTML = '';
      feat.versions.forEach((v, idx) => {
        const btn = document.createElement('button');
        btn.className = 'ver-btn' + (v.version === state.version ? ' active' : '');
        const isApp = approved === v.version;
        btn.innerHTML = `
          <span>${idx + 1}. ${v.version}</span>
          ${isApp ? '<span class="dot-approved" title="Bản đã chốt"></span>' : ''}
        `;
        btn.onclick = () => {
          state.version = v.version;
          updateUrl();
          renderHeader();
          renderStage();
        };
        switcher.appendChild(btn);
      });

      const currVerObj = feat.versions.find((v) => v.version === state.version) || {};
      const isCurrApproved = approved === state.version;
      document.getElementById('versionNoteText').innerHTML = `
        <span>
          <strong>[${state.version}]</strong>
          ${isCurrApproved ? '<span style="color:#4ADE80;font-weight:600;"> (BẢN ĐÃ CHỐT)</span> ' : ''}
          ${currVerObj.notes || 'Không có ghi chú thêm.'}
        </span>
      `;

      document.getElementById('rawLinkBtn').href = getProtoUrl(state.version);

      const splitBtn = document.getElementById('splitCompareBtn');
      splitBtn.style.borderColor = state.splitMode ? 'var(--bar-accent)' : '';
      splitBtn.style.color = state.splitMode ? '#7DD3FC' : '';
    }

    function renderStage() {
      const stage = document.getElementById('stageArea');
      stage.className = 'stage' + (state.viewport !== 'full' ? ` vp-${state.viewport}` : '');

      const feat = state.featureData;
      if (!state.splitMode) {
        stage.innerHTML = `
          <div class="pane">
            <div class="iframe-wrap">
              <iframe src="${getProtoUrl(state.version)}" title="${state.version}"></iframe>
            </div>
          </div>
        `;
      } else {
        const optionsA = feat.versions
          .map((v) => `<option value="${v.version}" ${v.version === state.version ? 'selected' : ''}>${v.version}</option>`)
          .join('');
        const optionsB = feat.versions
          .map((v) => `<option value="${v.version}" ${v.version === state.compareVersion ? 'selected' : ''}>${v.version}</option>`)
          .join('');

        stage.innerHTML = `
          <div class="pane">
            <div class="compare-header">
              <span>Khung A (Chính)</span>
              <select class="compare-select" id="selectPaneA">${optionsA}</select>
            </div>
            <div class="iframe-wrap">
              <iframe src="${getProtoUrl(state.version)}" title="Pane A"></iframe>
            </div>
          </div>
          <div class="pane">
            <div class="compare-header">
              <span>Khung B (Đối chiếu)</span>
              <select class="compare-select" id="selectPaneB">${optionsB}</select>
            </div>
            <div class="iframe-wrap">
              <iframe src="${getProtoUrl(state.compareVersion)}" title="Pane B"></iframe>
            </div>
          </div>
        `;

        document.getElementById('selectPaneA').onchange = (e) => {
          state.version = e.target.value;
          updateUrl();
          renderHeader();
          renderStage();
        };
        document.getElementById('selectPaneB').onchange = (e) => {
          state.compareVersion = e.target.value;
          updateUrl();
          renderStage();
        };
      }
    }

    document.getElementById('splitCompareBtn').onclick = () => {
      state.splitMode = !state.splitMode;
      updateUrl();
      renderHeader();
      renderStage();
    };

    document.querySelectorAll('#viewportSwitcher .tool-btn').forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll('#viewportSwitcher .tool-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.viewport = btn.dataset.vp;
        renderStage();
      };
    });

    document.getElementById('copyPromoteBtn').onclick = async () => {
      const cmd = `/Users/vuonganhvu/Desktop/workspace/mockup/bin/proto promote ${state.project} ${state.feature} ${state.version} --to /Users/vuonganhvu/Desktop/workspace/${state.project}`;
      try {
        await navigator.clipboard.writeText(cmd);
        const btn = document.getElementById('copyPromoteBtn');
        const old = btn.textContent;
        btn.textContent = 'Đã copy lệnh!';
        setTimeout(() => (btn.textContent = old), 1800);
      } catch (err) {
        prompt('Copy lệnh dưới đây để chốt phiên bản:', cmd);
      }
    };

    document.getElementById('collapseBarBtn').onclick = () => {
      document.getElementById('appShell').classList.add('bar-collapsed');
    };

    document.getElementById('expandBarBtn').onclick = () => {
      document.getElementById('appShell').classList.remove('bar-collapsed');
    };

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key.toLowerCase() === 'h') {
        document.getElementById('appShell').classList.toggle('bar-collapsed');
      } else if (e.key.toLowerCase() === 's') {
        state.splitMode = !state.splitMode;
        updateUrl();
        renderHeader();
        renderStage();
      } else if (/^[1-9]$/.test(e.key) && state.featureData) {
        const idx = parseInt(e.key, 10) - 1;
        if (state.featureData.versions[idx]) {
          state.version = state.featureData.versions[idx].version;
          updateUrl();
          renderHeader();
          renderStage();
        }
      }
    });

    init();
  </script>
</body>
</html>
